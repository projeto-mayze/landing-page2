<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos recomendados pela Dra. Mayze</title>

<!-- ==========================================================================
     PONTO DE ENTRADA FÍSICO PARA /produtos NO GITHUB PAGES
     Este arquivo NÃO é uma cópia da landing page. Ele existe apenas porque
     o GitHub Pages precisa de um arquivo físico em /produtos/index.html
     para responder à URL https://dramayze.com.br/produtos — a landing page
     principal usa roteamento por hash (#produtos) dentro do index.html da
     raiz do site, então este arquivo apenas redireciona para lá.
     Redireciona para: https://dramayze.com.br/#produtos
     ========================================================================== -->

<!-- Redirecionamento imediato para navegadores sem JavaScript -->
<meta http-equiv="refresh" content="0; url=https://dramayze.com.br/#produtos">

<link rel="canonical" href="https://dramayze.com.br/#produtos">

<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F1EEE2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #515150;
  }
  p { font-size: 15px; }
  a { color: #846649; }
</style>
</head>
<body>
  <!-- Redirecionamento imediato para navegadores com JavaScript (prioritário) -->
  <script>
    window.location.replace("https://dramayze.com.br/#produtos");
  </script>

  <!-- Aparece apenas na fração de segundo antes do redirecionamento,
       ou caso o redirecionamento automático falhe por algum motivo -->
  <noscript>
    <p>Redirecionando para os produtos recomendados pela Dra. Mayze...<br>
      Se você não for redirecionado automaticamente,
      <a href="https://dramayze.com.br/#produtos">clique aqui</a>.
    </p>
  </noscript>
</body>
</html>
