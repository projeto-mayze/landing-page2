<style>
  :root{
    --cream: #F1EEE2;
    --cream-deep: #e7e0cd;
    --gold: #C6AA89;
    --gold-soft: #d8c4a6;
    --brown: #846649;
    --brown-deep: #4a3826;
    --gray: #515150;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--cream);
    color: var(--gray);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    width: 100%;
    max-width: 100vw;
  }

  /* ---------- ambient background ---------- */

  .ambient{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .ambient::before{
    content: "";
    position: absolute;
    top: -20%;
    right: -15%;
    width: 60vw;
    height: 60vw;
    max-width: 700px;
    max-height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgba(198,170,137,0.35), rgba(198,170,137,0) 70%);
  }

  .ambient::after{
    content: "";
    position: absolute;
    bottom: -25%;
    left: -20%;
    width: 55vw;
    height: 55vw;
    max-width: 620px;
    max-height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle at 60% 60%, rgba(132,102,73,0.18), rgba(132,102,73,0) 70%);
  }

  .drift{
    position: absolute;
    opacity: 0.55;
    animation: drift 14s ease-in-out infinite;
  }
  .drift.moon{ top: 8%; right: 8%; width: 64px; animation-duration: 16s; }
  .drift.star1{ top: 18%; right: 20%; width: 14px; animation-duration: 11s; animation-delay: .5s; }
  .drift.star2{ top: 30%; right: 6%; width: 10px; animation-duration: 13s; animation-delay: 1.4s; }
  .drift.star3{ top: 6%; right: 30%; width: 8px; animation-duration: 9s; animation-delay: .2s; }

  @keyframes drift{
    0%, 100%{ transform: translate(0,0) rotate(0deg); }
    50%{ transform: translate(-6px, 10px) rotate(6deg); }
  }

  /* ---------- brand logo ---------- */

  .brand-logo{
    position: fixed;
    top: 16px;
    right: 6%;
    width: 130px;
    max-width: 16vw;
    min-width: 90px;
    height: auto;
    z-index: 0;
    opacity: 0.92;
    pointer-events: none;
  }

  /* ---------- layout ---------- */

  main{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 6vh 1.5rem 5rem;
    text-align: center;
    box-sizing: border-box;
  }

  /* ---------- intro overlay ---------- */

  .intro-overlay{
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    animation: overlayExit 0.9s ease-in forwards;
    animation-delay: 2.3s;
  }

  @keyframes overlayExit{
    to{ transform: translateY(-100%); opacity: 0; }
  }

  /* ---------- page content ---------- */

  .content{
    opacity: 0;
    transform: translateY(16px);
    animation: contentReveal 0.9s ease-out forwards;
    animation-delay: 2.6s;
  }

  @keyframes contentReveal{
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- envelope scene ---------- */

  .scene{
    position: relative;
    width: 220px;
    height: 150px;
    perspective: 900px;
  }

  .letter{
    position: absolute;
    left: 50%;
    bottom: 18px;
    width: 168px;
    height: 118px;
    margin-left: -84px;
    background: #fbf9f3;
    border: 1px solid var(--gold-soft);
    border-radius: 3px;
    box-shadow: 0 10px 24px rgba(74,56,38,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(6px);
    animation: letterRise 1s ease-out forwards;
    animation-delay: 1.1s;
    z-index: 1;
  }

  .letter span{
    font-family: 'Grand Hotel', cursive;
    font-size: 1.6rem;
    color: var(--brown);
  }

  @keyframes letterRise{
    to{ opacity: 1; transform: translateY(-46px); }
  }

  .envelope{
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .envelope-pocket{
    position: absolute;
    bottom: 0;
    left: 0;
    width: 220px;
    height: 118px;
    background: var(--cream-deep);
    border: 1px solid var(--gold);
    border-radius: 4px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }

  .envelope-pocket::before{
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(132,102,73,0.12);
    clip-path: polygon(0 0, 100% 0, 50% 78%);
  }

  .envelope-flap{
    position: absolute;
    top: 0;
    left: 0;
    width: 220px;
    height: 75px;
    background: var(--gold);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform: rotateX(0deg);
    animation: flapOpen 0.9s ease-in-out forwards;
    animation-delay: 0.6s;
    z-index: 3;
    border-top-left-radius: 4px;
    border-top-right-radius: 4px;
  }

  @keyframes flapOpen{
    to{ transform: rotateX(180deg); }
  }

  .seal{
    position: absolute;
    top: 46px;
    left: 50%;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    background: var(--brown-deep);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-soft);
    font-family: 'Grand Hotel', cursive;
    font-size: 1.1rem;
    z-index: 4;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    animation: sealBreak 0.5s ease-in forwards;
    animation-delay: 0.9s;
  }

  @keyframes sealBreak{
    to{ opacity: 0; transform: scale(0.4) translateY(6px); }
  }

  @media (prefers-reduced-motion: reduce){
    .envelope-flap, .letter, .seal, .drift, .intro-overlay, .content{ animation: none !important; }
    .envelope-flap{ transform: rotateX(180deg); }
    .letter{ opacity: 1; transform: translateY(-46px); }
    .seal{ display: none; }
    .intro-overlay{ display: none; }
    .content{ opacity: 1; transform: none; }
  }

  /* ---------- typography ---------- */

  h1{
    font-family: 'Grand Hotel', cursive;
    font-weight: 400;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    color: var(--brown-deep);
    margin: 0 0 0.6rem;
    line-height: 1.15;
  }

  .subhead{
    font-size: 1.1rem;
    color: var(--brown);
    margin: 0 0 1.6rem;
    font-weight: 400;
  }

  p{
    font-size: 1rem;
    line-height: 1.8;
    color: var(--gray);
    max-width: 46ch;
    margin: 0 auto 1.8rem;
  }

  /* ---------- button ---------- */

  .cta{
    display: inline-block;
    background: var(--brown);
    color: var(--cream);
    text-decoration: none;
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: 0.01em;
    padding: 0.95rem 2.4rem;
    border-radius: 8px;
    border: 1px solid var(--brown);
    transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
  }

  .cta:hover{
    background: var(--gold);
    border-color: var(--gold);
    color: var(--brown-deep);
    transform: translateY(-1px);
  }

  .cta:focus-visible{
    outline: 3px solid var(--brown-deep);
    outline-offset: 3px;
  }

  .cta-note{
    font-size: 0.82rem;
    color: var(--brown);
    margin-top: 0.9rem;
    opacity: 0.85;
  }

  /* ---------- divider ---------- */

  .divider{
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin: 3.4rem auto 2.6rem;
    max-width: 320px;
  }

  .divider::before, .divider::after{
    content: "";
    flex: 1;
    height: 1px;
    background: var(--gold);
    opacity: 0.6;
  }

  .divider svg{ width: 16px; height: 16px; flex-shrink: 0; }

  /* ---------- steps ---------- */

  .steps{
    list-style: none;
    padding: 0;
    margin: 0 auto 1rem;
    max-width: 480px;
    text-align: left;
    display: grid;
    gap: 1.3rem;
  }

  .steps li{
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }

  .step-mark{
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: 1px solid var(--brown);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
    font-size: 0.85rem;
    color: var(--brown);
    margin-top: 0.1rem;
  }

  .steps p{
    margin: 0;
    max-width: none;
    text-align: left;
  }

  .steps strong{
    display: block;
    color: var(--brown-deep);
    font-weight: 500;
    margin-bottom: 0.15rem;
  }

  /* ---------- philosophy quote ---------- */

  .quote{
    margin: 3rem auto 0;
    max-width: 420px;
  }

  .quote-mark{
    font-family: 'Grand Hotel', cursive;
    font-size: 3rem;
    color: var(--gold);
    line-height: 1;
    display: block;
    margin-bottom: -0.4rem;
  }

  .quote p{
    font-style: italic;
    font-size: 1.02rem;
    line-height: 1.75;
    color: var(--brown-deep);
  }

  .quote cite{
    display: block;
    font-style: normal;
    font-size: 0.85rem;
    color: var(--brown);
    margin-top: 0.6rem;
  }

  /* ---------- footer ---------- */

  footer{
    margin-top: 4rem;
    padding-top: 1.8rem;
    border-top: 1px solid var(--gold-soft);
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    overflow-wrap: break-word;
    word-break: break-word;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  footer > *{
    max-width: 100%;
  }

  .signature{
    font-family: 'Grand Hotel', cursive;
    font-size: 1.6rem;
    color: var(--brown);
    margin: 0 0 1.2rem;
  }

  .social{
    margin: 0 0 1.2rem;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .social a{
    color: var(--brown);
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }

  .social a:hover{ border-color: var(--brown); }

  .fine-print{
    font-size: 0.78rem;
    color: var(--brown);
    opacity: 0.75;
    line-height: 1.6;
    margin: 0;
    max-width: 100%;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  @media (max-width: 420px){
    .scene{ width: 190px; }
    .envelope-pocket, .envelope-flap{ width: 190px; }
    .letter{ width: 145px; margin-left: -72.5px; }
    .brand-logo{ top: 10px; right: 5%; width: 88px; max-width: 24vw; min-width: 64px; }
  }
</style>
</head>

  <svg class="drift star2" viewBox="0 0 24 24" fill="none"><path d="M12 0l2.2 8.8L23 11l-8.8 2.2L12 22l-2.2-8.8L1 11l8.8-2.2L12 0Z" fill="#C6AA89"/></svg>
